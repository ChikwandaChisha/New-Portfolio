<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#F5F1E8" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#14110E" media="(prefers-color-scheme: dark)" />
  <meta name="description"
    content="Chikwanda Chisha — software engineer working across AI, security, and systems. CS at Dartmouth College." />
  <meta name="color-scheme" content="light dark" />
  <title>Chikwanda Chisha | Software Engineer</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="256x256" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- Apply saved/preferred theme before paint to avoid a flash -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        var isDark = stored === 'dark';
        document.documentElement.classList.toggle('dark', isDark);
        document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
      } catch (e) { }
    })();
  </script>

  <!-- Open Graph -->
  <meta property="og:title" content="Chikwanda Chisha | Software Engineer" />
  <meta property="og:description"
    content="Software engineer working across AI, security, and systems. CS at Dartmouth College." />
  <meta property="og:type" content="website" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
